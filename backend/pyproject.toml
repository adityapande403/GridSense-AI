[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gridsense-backend"
version = "0.1.0"
description = "GridSense-AI: Advisory-Only Distribution Network Intelligence Platform"
authors = [{ name = "GridSense Engineering Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "geoalchemy2>=0.14.0",
    "shapely>=2.0.0",
    "pandapower>=2.13.0",
    "networkx>=3.0",
    "scipy>=1.11.0",
    "numpy>=1.26.0",
    "pyomo>=6.7.0",
    "highspy>=1.7.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
